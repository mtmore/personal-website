<!DOCTYPE html>
<html lang="en" dir="ltr">
<link rel="stylesheet" href="../css/styles.css">
    <title>Contact | portfolio-website</title>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* استایل‌های مشترک */
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 0;
            background-color: #0a0a0a;
            color: #fff;
            min-height: 100vh;
        }
        
        header {
            background: linear-gradient(135deg, #0a0a0a, #1a1a2e);
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid #00f3ff;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
        }
        
        nav {
            margin-bottom: 20px;
        }
        
        header a {
            color: #00f3ff;
            text-decoration: none;
            margin: 0 15px;
            font-size: 18px;
            transition: 0.3s;
            text-shadow: 0 0 5px #00f3ff;
            padding: 10px 20px;
            border: 1px solid #00f3ff;
            border-radius: 5px;
        }
        
        header a:hover {
            color: #ff00ff;
            text-shadow: 0 0 10px #ff00ff;
            border-color: #ff00ff;
            background: rgba(255, 0, 255, 0.1);
        }
        
        h1 {
            color: #00f3ff;
            text-shadow: 0 0 10px #00f3ff;
            margin: 20px 0;
        }
        
        main {
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        
        .section {
            background: rgba(26, 26, 46, 0.8);
            border-radius: 10px;
            padding: 40px;
            border: 1px solid #00f3ff;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
            text-align: center;
        }
        
        footer {
            background: linear-gradient(135deg, #1a1a2e, #0a0a0a);
            padding: 20px;
            text-align: center;
            border-top: 1px solid #00f3ff;
            margin-top: 50px;
        }
        
        footer p {
            color: #00f3ff;
            text-shadow: 0 0 5px #00f3ff;
        }
        
        /* استایل‌های خاص صفحه Contact */
        .contact-info {
            margin: 30px 0;
        }
        
        .linkedin-link {
            display: inline-block;
            background: linear-gradient(135deg, #0077b5, #00a0dc);
            color: white;
            text-decoration: none;
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 20px;
            font-weight: bold;
            transition: all 0.3s ease;
            border: 2px solid #0077b5;
            margin: 20px 0;
        }
        
        .linkedin-link:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0, 119, 181, 0.4);
            background: linear-gradient(135deg, #00a0dc, #0077b5);
        }
        
        .contact-text {
            font-size: 18px;
            margin-bottom: 30px;
            color: #ff00ff;
        }
        
        .linkedin-icon {
            margin-right: 10px;
            font-size: 24px;
        }
        
        /* ریسپانسیو برای موبایل */
        @media (max-width: 768px) {
            main {
                padding: 10px;
                margin: 30px auto;
            }
            
            .section {
                padding: 30px 20px;
            }
            
            .linkedin-link {
                padding: 12px 25px;
                font-size: 18px;
            }
            
            header a {
                display: block;
                margin: 10px auto;
                width: 200px;
                text-align: center;
            }
        }
        
        @media (max-width: 480px) {
            .linkedin-link {
                padding: 10px 20px;
                font-size: 16px;
            }
            
            .contact-text {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <a href="../index.html/index.html">Home</a>
            <a href="../about.html/about.html">About me</a>
            <a href="../skills.html/skills.html">Skills</a>
            <a href="../projects.html/projects.html">Projects</a>
            <a href="contact.html">Contact</a>
        </nav>
        <h1></h1>
    </header>
    
    <main>
        <div class="section">
            <h2 style="color: #00f3ff;">Let's Connect!</h2>
            <p class="contact-text">You can find me on LinkedIn for professional inquiries and networking</p>
            
            <div class="contact-info">
                <a href="https://www.linkedin.com/in/mohammad-mahdi-tamassoki/" class="linkedin-link" target="_blank">
                    <span class="linkedin-icon">👔</span>
                    Connect on LinkedIn
                </a>
            </div>
            
            <p style="color: #00f3ff; font-size: 14px; margin-top: 20px;">
                Click the button above to visit my LinkedIn profile
            </p>
        </div>
    </main>
    
    <footer>
        <p>&copy; 2023 Neon Portfolio. All rights reserved.</p>
    </footer>
</body>
</html>
