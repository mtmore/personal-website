<!DOCTYPE html>
<html lang="en" dir="ltr">
<link rel="stylesheet" href="../css/styles.css">
    <title>portfolio-website</title>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* استایل‌های پایه */
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 0;
            background-color: #0a0a0a;
            color: #fff;
        }
        
        header {
            background: linear-gradient(135deg, #0a0a0a, #1a1a2e);
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid #00f3ff;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
        }
        
        nav {
            margin-bottom: 20px;
        }
        
        header a {
            color: #00f3ff;
            text-decoration: none;
            margin: 0 15px;
            font-size: 18px;
            transition: 0.3s;
            text-shadow: 0 0 5px #00f3ff;
            padding: 8px 16px;
            border: 1px solid #00f3ff;
            border-radius: 5px;
        }
        
        header a:hover {
            color: #ff00ff;
            text-shadow: 0 0 10px #ff00ff;
            border-color: #ff00ff;
            background: rgba(255, 0, 255, 0.1);
        }
        
        h1 {
            color: #00f3ff;
            text-shadow: 0 0 10px #00f3ff;
            margin-top: 20px;
        }
        
        main {
            max-width: 800px;
            margin: 30px auto;
            padding: 20px;
        }
        
        /* استایل بخش پروفایل */
        .profile-container {
            background: rgba(26, 26, 46, 0.8);
            border-radius: 10px;
            padding: 30px;
            margin-bottom: 30px;
            border: 1px solid #00f3ff;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
            text-align: center;
        }
        
        .profile-image {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #00f3ff;
            margin-bottom: 20px;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.4);
        }
        
        .profile-name {
            font-size: 28px;
            margin-bottom: 10px;
            color: #00f3ff;
            text-shadow: 0 0 5px #00f3ff;
        }
        
        .profile-title {
            font-size: 20px;
            color: #ff00ff;
            margin-bottom: 15px;
            text-shadow: 0 0 5px #ff00ff;
        }
        
        p {
            font-size: 18px;
            line-height: 1.8;
        }
    </style>
</>
<body>
    <header>
        <nav>
            <a href="index.html">Home</a>
            <a href="../about.html/about.html">About me</a>
            <a href="../skills.html/skills.html">Skills</a>
            <a href="../projects.html/projects.html">Projects</a>
            <a href="../contact.html/contact.html">Contact</a>
        </nav>
        <h1>Welcome to my site</h1>
        
        <!-- بخش پروفایل اضافه شده -->
        <div class="profile-container">
            <img src="../images/profile.jpg/IMG_20250925_141445.jpg" alt="Profile Image" class="profile-image">
            <h2 class="profile-name">Mohammad Mahdi Tamassoki</h2>
            <p class="profile-title">Backend Developer / Computer engineering student</p>
        </div>
    </header>
    
    <main>
</body>
</html>
